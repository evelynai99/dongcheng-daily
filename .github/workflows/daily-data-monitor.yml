name: Daily Beijing district data monitor

on:
  schedule:
    # 00:30 UTC = 08:30 Beijing time
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-data-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check official and tracked sources
        run: node scripts/update-source-monitor.mjs

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/source-monitor.json local-preview/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed monitor snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "government-daily-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/source-monitor.json local-preview/index.html
          git commit -m "Daily source monitor update"
          git push
